# Build the solver and run a short smoke test of the tutorial
name: Build and test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        version: ["2312", "2512"]

    container:
      image: opencfd/openfoam-dev:${{ matrix.version }}

    steps:
      - uses: actions/checkout@v4

      # OpenFOAM's bashrc is not safe under "bash -e": source it first
      - name: Build
        shell: bash {0}
        run: |
          source /usr/lib/openfoam/openfoam${{ matrix.version }}/etc/bashrc
          set -eo pipefail
          cd src && wmake 2>&1 | tee log.wmake
          test -x "$FOAM_USER_APPBIN/interLevelSetFoam"

      - name: Smoke test (bubbleColumn, coarse mesh, 20 steps)
        shell: bash {0}
        run: |
          source /usr/lib/openfoam/openfoam${{ matrix.version }}/etc/bashrc
          set -eo pipefail
          cp -r Tutorial/bubbleColumn "$RUNNER_TEMP/case" && cd "$RUNNER_TEMP/case"
          sed -i 's/(160 320 1)/(40 80 1)/' system/blockMeshDict
          foamDictionary -entry levelSet/cellSize -remove constant/transportProperties
          foamDictionary -entry endTime -set 0.0078125 system/controlDict
          foamDictionary -entry writeInterval -set 0.0078125 system/controlDict
          ./Allrun
          grep -q '^End' log.interLevelSetFoam
          test -s postProcessing/bubble/0/volFieldValue.dat
          tail -n 2 postProcessing/bubble/0/volFieldValue.dat
